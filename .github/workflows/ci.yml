name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
          # Integration tests use the Linux default module path; symlink to it
          # if the package installed the module elsewhere.
          module="$(find /usr -name 'libsofthsm2.so' 2>/dev/null | head -1)"
          echo "SoftHSM module: $module"
          test -n "$module" || { echo 'libsofthsm2.so not found after install'; exit 1; }
          sudo mkdir -p /usr/lib/softhsm
          [ -e /usr/lib/softhsm/libsofthsm2.so ] || sudo ln -s "$module" /usr/lib/softhsm/libsofthsm2.so
          ls -l /usr/lib/softhsm/libsofthsm2.so
          softhsm2-util --version

      - name: Restore
        run: dotnet restore CAManagement.sln

      # Owns what the NU1901-NU1904 exclusion in Directory.Build.props hands over: audit advisories are
      # kept out of TreatWarningsAsErrors so a fresh advisory cannot break every compile mid-task, and that
      # trade is only safe while THIS step blocks instead. Fails the build and prints the advisory URL per
      # package — the fix is always a pin past the transitive version the upstream package holds down.
      - name: Vulnerable dependency scan
        run: |
          set -euo pipefail
          dotnet list CAManagement.sln package --vulnerable --include-transitive --format json > vuln.json
          count=$(jq '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0)] | length' vuln.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count vulnerable package reference(s) — pin to a fixed version:"
            jq -r '.projects[] | .path as $p | (.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0) | "\($p | split("/") | last)  \(.id) \(.resolvedVersion)  \(.vulnerabilities[].severity)  \(.vulnerabilities[].advisoryurl)")' vuln.json | sort -u
            exit 1
          fi
          echo "No vulnerable dependencies."

      - name: Build
        run: dotnet build CAManagement.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test CAManagement.sln -c Release --no-build --nologo -v n

      - name: Pack (validate NuGet packaging)
        run: dotnet pack CAManagement.sln -c Release -o dist/nuget --no-build --nologo

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/nuget/*.nupkg
          if-no-files-found: error
